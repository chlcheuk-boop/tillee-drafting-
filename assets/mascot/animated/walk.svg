<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 264 240"><title>Tillee mascot, walk</title><style>#leg-front { transform-box: view-box; transform-origin: 138px 180px; animation: m-walk-leg-front 700ms ease-in-out infinite both; }
@keyframes m-walk-leg-front { 0.0% { transform: rotate(-14deg) } 50.0% { transform: rotate(14deg) } 100.0% { transform: rotate(-14deg) } }
#leg-back { transform-box: view-box; transform-origin: 102px 180px; animation: m-walk-leg-back 700ms ease-in-out infinite both; }
@keyframes m-walk-leg-back { 0.0% { transform: rotate(14deg) } 50.0% { transform: rotate(-14deg) } 100.0% { transform: rotate(14deg) } }
#arm-near { transform-box: view-box; transform-origin: 184px 128px; animation: m-walk-arm-near 700ms ease-in-out infinite both; }
@keyframes m-walk-arm-near { 0.0% { transform: rotate(10deg) } 50.0% { transform: rotate(-10deg) } 100.0% { transform: rotate(10deg) } }
#arm-far { transform-box: view-box; transform-origin: 56px 128px; animation: m-walk-arm-far 700ms ease-in-out infinite both; }
@keyframes m-walk-arm-far { 0.0% { transform: rotate(-10deg) } 50.0% { transform: rotate(10deg) } 100.0% { transform: rotate(-10deg) } }
#mascot { transform-box: view-box; transform-origin: 120px 218px; animation: m-walk-mascot 700ms ease-in-out infinite both; }
@keyframes m-walk-mascot { 0.0% { transform: translateY(0px) } 25.0% { transform: translateY(-3px) } 50.0% { transform: translateY(0px) } 75.0% { transform: translateY(-3px) } 100.0% { transform: translateY(0px) } }
#eyes { transform-box: view-box; transform-origin: 120px 106px; animation: m-blink-eyes 5000ms ease-in-out infinite both; }
@keyframes m-blink-eyes { 0.0% { transform: scale(1, 1) } 92.0% { transform: scale(1, 1) } 95.0% { transform: scale(1, 0.1) } 100.0% { transform: scale(1, 1) } }
@media (prefers-reduced-motion: reduce) { #mascot, #shadow, #arm-far, #arm-near, #leg-back, #leg-front, #head, #eyes, #fx { animation: none !important; } }</style><ellipse id="shadow" cx="120" cy="218" rx="64" ry="7" fill="#000000" opacity="0.25"/><g id="mascot"><g id="leg-back"><path d="M102,180 L92,204" fill="none" stroke="#3F2596" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M102,180 L92,204" fill="none" stroke="#5A36C4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></g><g id="leg-front"><path d="M138,180 L150,203" fill="none" stroke="#3F2596" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M138,180 L150,203" fill="none" stroke="#5A36C4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></g><g id="arm-far"><path d="M56,128 L38,146 L34,168" fill="none" stroke="#3F2596" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M56,128 L38,146 L34,168" fill="none" stroke="#7A52E6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33" cy="177" r="9" fill="#8C68EE" stroke="#3F2596" stroke-width="2.5"/></g><circle cx="120" cy="120" r="72" fill="#7A52E6"/><path d="M120,48 A72,72 0 0 1 120,192 A44,72 0 0 0 120,48 Z" fill="#5A36C4" opacity="0.55"/><g id="head"><circle cx="96" cy="106" r="21" fill="#FFFFFF" stroke="#2A2340" stroke-width="5"/><circle cx="144" cy="106" r="21" fill="#FFFFFF" stroke="#2A2340" stroke-width="5"/><path d="M117,103 Q120,98 123,103" fill="none" stroke="#2A2340" stroke-width="5" stroke-linecap="round"/><g id="eyes"><circle cx="98" cy="106" r="7.5" fill="#2A2340"/><circle cx="100.5" cy="103" r="2.4" fill="#FFFFFF"/><circle cx="146" cy="106" r="7.5" fill="#2A2340"/><circle cx="148.5" cy="103" r="2.4" fill="#FFFFFF"/></g><path d="M110,136 Q120,144 130,136" fill="none" stroke="#2A2340" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M120,168 L97,156 Q91,168 97,180 Z" fill="#E0303A"/><path d="M120,168 L143,156 Q149,168 143,180 Z" fill="#E0303A"/><rect x="113" y="161" width="14" height="14" rx="4" fill="#A81E2A"/></g><g id="arm-near"><path d="M184,128 L204,150 L210,170" fill="none" stroke="#3F2596" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M184,128 L204,150 L210,170" fill="none" stroke="#7A52E6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="212" cy="179" r="9" fill="#8C68EE" stroke="#3F2596" stroke-width="2.5"/></g><g id="fx"></g></g></svg>
