<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 264 240"><title>Tillee mascot, celebrate</title><style>#mascot { transform-box: view-box; transform-origin: 120px 218px; animation: m-celebrate-mascot 800ms ease-in-out infinite both; }
@keyframes m-celebrate-mascot { 0.0% { transform: translateY(0px) scale(1, 1) } 20.0% { transform: translateY(0px) scale(1, 0.94) } 50.0% { transform: translateY(-12px) scale(1, 1.03) } 80.0% { transform: translateY(0px) scale(1, 0.97) } 100.0% { transform: translateY(0px) scale(1, 1) } }
#shadow { transform-box: view-box; transform-origin: 120px 218px; animation: m-celebrate-shadow 800ms ease-in-out infinite both; }
@keyframes m-celebrate-shadow { 0.0% { transform: scale(1, 1) } 50.0% { transform: scale(0.75, 1) } 100.0% { transform: scale(1, 1) } }
#fx { transform-box: view-box; transform-origin: 120px 30px; animation: m-celebrate-fx 800ms ease-in-out infinite both; }
@keyframes m-celebrate-fx { 0.0% { transform: scale(0.8, 0.8); opacity: 0 } 50.0% { transform: scale(1.1, 1.1); opacity: 1 } 100.0% { transform: scale(1, 1); opacity: 1 } }
#eyes { transform-box: view-box; transform-origin: 120px 106px; animation: m-blink-eyes 5000ms ease-in-out infinite both; }
@keyframes m-blink-eyes { 0.0% { transform: scale(1, 1) } 92.0% { transform: scale(1, 1) } 95.0% { transform: scale(1, 0.1) } 100.0% { transform: scale(1, 1) } }
@media (prefers-reduced-motion: reduce) { #mascot, #shadow, #arm-far, #arm-near, #leg-back, #leg-front, #head, #eyes, #fx { animation: none !important; } }</style><ellipse id="shadow" cx="120" cy="218" rx="56" ry="7" fill="#000000" opacity="0.25"/><g id="mascot"><g id="leg-back"><path d="M102,180 L100,206" fill="none" stroke="#3F2596" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M102,180 L100,206" fill="none" stroke="#5A36C4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></g><g id="leg-front"><path d="M138,180 L140,206" fill="none" stroke="#3F2596" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M138,180 L140,206" fill="none" stroke="#5A36C4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></g><g id="arm-far"><path d="M56,128 L38,100 L34,74" fill="none" stroke="#3F2596" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M56,128 L38,100 L34,74" fill="none" stroke="#7A52E6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33" cy="64" r="9" fill="#8C68EE" stroke="#3F2596" stroke-width="2.5"/></g><circle cx="120" cy="120" r="72" fill="#7A52E6"/><path d="M120,48 A72,72 0 0 1 120,192 A44,72 0 0 0 120,48 Z" fill="#5A36C4" opacity="0.55"/><g id="head"><circle cx="96" cy="106" r="21" fill="#FFFFFF" stroke="#2A2340" stroke-width="5"/><circle cx="144" cy="106" r="21" fill="#FFFFFF" stroke="#2A2340" stroke-width="5"/><path d="M117,103 Q120,98 123,103" fill="none" stroke="#2A2340" stroke-width="5" stroke-linecap="round"/><g id="eyes"><circle cx="98" cy="106" r="7.5" fill="#2A2340"/><circle cx="100.5" cy="103" r="2.4" fill="#FFFFFF"/><circle cx="146" cy="106" r="7.5" fill="#2A2340"/><circle cx="148.5" cy="103" r="2.4" fill="#FFFFFF"/></g><path d="M104,132 Q120,158 136,132 Z" fill="#2A2340" stroke="#2A2340" stroke-width="3" stroke-linejoin="round"/><path d="M110,135 L130,135 L128,139 L112,139 Z" fill="#FFFFFF"/><path d="M120,168 L97,156 Q91,168 97,180 Z" fill="#E0303A"/><path d="M120,168 L143,156 Q149,168 143,180 Z" fill="#E0303A"/><rect x="113" y="161" width="14" height="14" rx="4" fill="#A81E2A"/></g><g id="arm-near"><path d="M184,128 L202,100 L206,74" fill="none" stroke="#3F2596" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M184,128 L202,100 L206,74" fill="none" stroke="#7A52E6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="207" cy="64" r="9" fill="#8C68EE" stroke="#3F2596" stroke-width="2.5"/></g><g id="fx"><path d="M120,22 L120,34" stroke="#E0303A" stroke-linecap="round" fill="none" stroke-width="4"/><path d="M96,28 L102,38" stroke="#E0303A" stroke-linecap="round" fill="none" stroke-width="4"/><path d="M144,28 L138,38" stroke="#E0303A" stroke-linecap="round" fill="none" stroke-width="4"/><circle cx="20" cy="44" r="3" fill="#E0303A"/><circle cx="220" cy="44" r="3" fill="#E0303A"/></g></g></svg>
